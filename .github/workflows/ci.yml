name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.4"
      # Rules and excluded paths are in pyproject.toml ([tool.ruff]).
      - run: ruff check .

  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }}, ${{ matrix.extras }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Core install (numpy, pydantic, pyyaml) on every supported Python.
        # Vendor SDKs are never installed: tests run against fakes.
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        extras: [core]
        include:
          # Optional extras (MuJoCo, OpenCV, PyAV, sounddevice) on the oldest and newest Python.
          - {python: "3.9", os: ubuntu-latest, extras: all}
          - {python: "3.13", os: ubuntu-latest, extras: all}
          # The core is pure Python; check it imports and runs on macOS too.
          - {python: "3.12", os: macos-latest, extras: core}
          # Oldest dependency versions pyproject.toml allows.
          - {python: "3.9", os: ubuntu-latest, extras: minimum}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for the extras
        if: matrix.extras == 'all'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 libegl1 libgl1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          case "${{ matrix.extras }}" in
            core)    pip install -e ".[dev]" ;;
            all)     pip install -e ".[dev,sim,camera,video,audio]" ;;
            minimum) pip install "numpy==1.21.*" "pydantic==2.0.*" "pyyaml==6.0.*" \
                       && pip install -e ".[dev]" ;;
          esac
      - run: pip list
      - name: Test
        env:
          MUJOCO_GL: egl
        run: python -m pytest -q -rs

  package:
    # Build the sdist and wheel, install the wheel outside the source tree, and
    # check the built-in configs and driver manifests shipped with it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel and load every built-in config
        working-directory: /tmp
        run: |
          pip install "$GITHUB_WORKSPACE"/dist/*.whl
          hirobot --version
          hirobot configs
          python - <<'EOF'
          from pathlib import Path
          import hirobot
          from hirobot.config import available_configs, load_config
          from hirobot.sdk import load_manifest
          assert "site-packages" in hirobot.__file__, hirobot.__file__
          names = available_configs()
          assert names, "no built-in configs in the wheel"
          for name in names:
              load_config(name)
          drivers = Path(hirobot.__file__).parent / "drivers"
          manifests = sorted(drivers.rglob("manifest.yaml"))
          assert manifests, "no driver manifests in the wheel"
          for m in manifests:
              load_manifest(".".join(m.parent.relative_to(drivers.parent.parent).parts))
          print(f"{len(names)} configs, {len(manifests)} manifests")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
