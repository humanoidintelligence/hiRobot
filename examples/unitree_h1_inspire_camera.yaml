# Unitree H1 + Inspire hands, head camera from your own image server.
#
# overrides change only the head camera's size and address; the rest of
# unitree_h1_inspire stays. A different driver type replaces the whole driver:
# entry. The server is scripts/camera_image_server.py on the computer the camera
# is plugged into (docs/setup/unitree.md).

defaults: [robots/unitree_h1_inspire]

assembly:
  parts:
    head:
      overrides:
        width: 640
        height: 480
        driver: {address: "tcp://<camera computer>:5555"}
    body:
      overrides:
        driver:
          type: unitree_sdk2
          network_interface: <nic>
          msg_family: go     # the legacy H1 uses the unitree_go messages
