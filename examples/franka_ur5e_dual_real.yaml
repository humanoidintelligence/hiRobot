# The built-in Franka FR3 + UR5e (robots/franka_ur5e_dual) on hardware.
#
# defaults: takes the built-in file; the overrides below go down to each arm's
# body. The placement stays the built-in one, so ee_poses and ee_targets are in
# that robot's frame.

defaults: [robots/franka_ur5e_dual]

assembly:
  parts:
    left:  {overrides: {body: {driver: {type: franka_libfranka, ip: <franka ip>}}}}
    right: {overrides: {body: {driver: {type: ur_rtde, ip: <ur ip>}}}}
