# Unitree G1 with a MuJoCo twin in shadow mode.
#
# The real robot is read-only; the twin starts from its measured pose and runs
# every action, so a motion can be rehearsed before it is sent to the robot.
# Change mode to mirror to command the robot and watch its measured state in
# the viewer. The MJCF is fetched as described in sim/mujoco/unitree_g1
# (hirobot configs sim).

defaults: [unitree_g1_real.yaml]

sim:
  mode: shadow       # off | mirror | shadow
  model: ~/.cache/hirobot/unitree_ros/robots/g1_description/g1_29dof_rev_1_0.xml
  viewer: true
  fixed_base: true   # pelvis welded in place, like the robot on its gantry
  base_height: 1.0
  # Rotor inertia per joint, as in the built-in sim/mujoco/unitree_g1 (the MJCF has none).
  armature: [0.0103, 0.0251, 0.0103, 0.0251, 0.003597, 0.003597,
             0.0103, 0.0251, 0.0103, 0.0251, 0.003597, 0.003597,
             0.0103, 0.0103, 0.0103,
             0.003597, 0.003597, 0.003597, 0.003597, 0.003597, 0.003597, 0.003597,
             0.003597, 0.003597, 0.003597, 0.003597, 0.003597, 0.003597, 0.003597]
