# Example robot config: a humanoid with a head camera, written from scratch.
#
# hiRobot describes a robot's I/O contract and which driver drives it. What
# decides the actions (a VLA served by hiVLA, an agent in hiAgent) is not part
# of the config. Every device is written inline (device: ...); a device file
# under hirobot/configs/ is the same mapping in its own file, named with from:.

assembly:
  name: generic-humanoid
  parts:
    body:
      device: body
      control_hz: 50
      floating_base: true    # a moving base: IMU / base state in observations
      joints:                # in the canonical I/O order; names enable DoF mapping
        - {name: left_hip_pitch}
        - {name: left_knee}
        - {name: left_ankle_pitch}
        - {name: right_hip_pitch}
        - {name: right_knee}
        - {name: right_ankle_pitch}
        - {name: left_shoulder_pitch}
        - {name: left_elbow}
        - {name: right_shoulder_pitch}
        - {name: right_elbow}
      frames:
        - {name: left_hand}
        - {name: right_hand}
      grippers: [left_hand, right_hand]
      driver: {type: toy}    # a registered body driver (toy | unitree_sdk2 | fourier_grx | ...)
    head:
      device: camera
      width: 224
      height: 224
