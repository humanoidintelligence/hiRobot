# Two UR5e arms on hardware, with the simulation check guarding every command.
#
# The real drivers run as usual. The check is not a driver: it is a private
# MuJoCo world inside the gate, built from the same tree, used only to predict
# the next few steps and refuse a command that would collide or overload a
# joint. It never sends. For it to run, every body needs a model: (its MJCF);
# add one under each arm's body overrides, e.g.
#   left: {overrides: {body: {model: {mjcf: ./models/ur5e.xml}}}}

defaults: [robots/ur5e_dual]

assembly:
  parts:
    left:  {overrides: {body: {driver: {type: ur_rtde, ip: 192.168.1.101}}}}
    right: {overrides: {body: {driver: {type: ur_rtde, ip: 192.168.1.102}}}}
  placement:
    right: {pose: [0.02, -0.81, 0, 0, 0, 0.0087, 1.0]}   # shared by the real arms and the check

safety:
  max_joint_step: 0.2
  sim_check:
    # scene: {mjcf: ./scenes/my_table.xml}   # optional: check against the table too
    horizon_steps: 5
    torque_ratio: 1.0
    budget_s: 0.02
    on_error: reject
