# Example robot config: a fixed-base 7-DoF arm (e.g. Franka / UR) with a wrist camera.
#
# Every device is written inline here (device: ...). A device file under
# hirobot/configs/ (body/franka/fr3_droid, ...) is the same mapping in its own file,
# named with from:. A fixed base has no IMU / base state in its observations.

assembly:
  name: generic-7dof-arm
  parts:
    body:
      device: body
      control_hz: 100
      floating_base: false
      joints:
        - {name: joint_1}
        - {name: joint_2}
        - {name: joint_3}
        - {name: joint_4}
        - {name: joint_5}
        - {name: joint_6}
        - {name: joint_7}
      frames:
        - {name: tcp, link: link7}
      grippers: [tcp]        # the body driver opens and closes it (Action.gripper)
      mounts:
        wrist_camera: {link: link7}
      driver: {type: toy}    # swap for franka_droid / ur_rtde on hardware
    wrist:
      device: camera
      width: 224
      height: 224
  placement:
    wrist: {on: body.wrist_camera}
