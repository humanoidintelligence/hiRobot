# Inspire RH56DFX six-DoF hand, left, as mounted on the Unitree H1: 6 joints in
# order pinky, ring, middle, index, thumb bend, thumb rotation. Positions are
# normalised, 0 = closed and 1 = open (the bridge scales to the 0-1000 angle
# registers), so every finger is limited to [0, 1].
#
# The driver uses Unitree's h1_inspire_service 1.0.1 (not 1.0.2):
# rt/inspire/{cmd,state}, 12 motors, 0-5 right, 6-11 left; this hand is motors 6-11.
# For the inspire_sdkpy bridge (scripts/inspire_serial_to_dds.py) override the
# driver with {type: inspire_sdkpy, side: left}. Versions and setup:
# docs/setup/unitree.md, "Inspire hands (H1)".

device: end_effector
interface: joints
joints:
  - {name: left_hand_pinky,          position_limit: [0.0, 1.0]}
  - {name: left_hand_ring,           position_limit: [0.0, 1.0]}
  - {name: left_hand_middle,         position_limit: [0.0, 1.0]}
  - {name: left_hand_index,          position_limit: [0.0, 1.0]}
  - {name: left_hand_thumb_bend,     position_limit: [0.0, 1.0]}
  - {name: left_hand_thumb_rotation, position_limit: [0.0, 1.0]}
# In simulation each hand value drives the finger joints of h1_with_hand.xml
# (unitree_ros robots/h1_description), q = offset + scale * value, read back from the
# first one. Ranges from Unitree xr_teleoperate robot_hand_inspire.py, which
# normalises value = (max - q) / (max - min): fingers 0..1.7 rad (1.7 closed), thumb
# bend 0..0.5, thumb rotation -0.1..1.3. The URDF mimic ratios couple the rest:
# *_intermediate = 1 * *_proximal, thumb_intermediate = 1.6 and thumb_distal = 2.4
# times thumb_proximal_pitch. A real hand driver ignores joint_map.
joint_map:
  left_hand_pinky:
    - {joint: L_pinky_proximal_joint, offset: 1.7, scale: -1.7}
    - {joint: L_pinky_intermediate_joint, offset: 1.7, scale: -1.7}
  left_hand_ring:
    - {joint: L_ring_proximal_joint, offset: 1.7, scale: -1.7}
    - {joint: L_ring_intermediate_joint, offset: 1.7, scale: -1.7}
  left_hand_middle:
    - {joint: L_middle_proximal_joint, offset: 1.7, scale: -1.7}
    - {joint: L_middle_intermediate_joint, offset: 1.7, scale: -1.7}
  left_hand_index:
    - {joint: L_index_proximal_joint, offset: 1.7, scale: -1.7}
    - {joint: L_index_intermediate_joint, offset: 1.7, scale: -1.7}
  left_hand_thumb_bend:
    - {joint: L_thumb_proximal_pitch_joint, offset: 0.5, scale: -0.5}
    - {joint: L_thumb_intermediate_joint, offset: 0.8, scale: -0.8}
    - {joint: L_thumb_distal_joint, offset: 1.2, scale: -1.2}
  left_hand_thumb_rotation:
    - {joint: L_thumb_proximal_yaw_joint, offset: 1.3, scale: -1.4}
driver:
  type: unitree_motorcmds
  cmd_topic: rt/inspire/cmd
  state_topic: rt/inspire/state
  num_motors: 12
  motor_offset: 6
  service: h1_inspire_service (inspire_hand -s /dev/ttyUSB0)
