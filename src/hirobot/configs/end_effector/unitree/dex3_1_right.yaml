# Unitree Dex3-1 three-finger hand, right: 7 joints in Dex3 motor order of
# rt/dex3/right/cmd (thumb 0-2, middle 0-1, index 0-1). Names, position limits and
# torque limits come from unitree_ros robots/g1_description/g1_29dof_with_hand_rev_1_0.urdf.
# The two hands are mirrored: the right fingers close towards positive angles.
# Mounted on the G1's right_wrist, it takes the place of the body's right_hand frame.

device: end_effector
interface: joints
joints:
  - {name: right_hand_thumb_0,  position_limit: [-1.0472, 1.0472], torque_limit: 2.45}
  - {name: right_hand_thumb_1,  position_limit: [-1.0472, 0.7243], torque_limit: 1.4}
  - {name: right_hand_thumb_2,  position_limit: [-1.7453, 0.0],    torque_limit: 1.4}
  - {name: right_hand_middle_0, position_limit: [0.0, 1.5708],     torque_limit: 1.4}
  - {name: right_hand_middle_1, position_limit: [0.0, 1.7453],     torque_limit: 1.4}
  - {name: right_hand_index_0,  position_limit: [0.0, 1.5708],     torque_limit: 1.4}
  - {name: right_hand_index_1,  position_limit: [0.0, 1.7453],     torque_limit: 1.4}
driver: {type: unitree_handcmd, side: right}
