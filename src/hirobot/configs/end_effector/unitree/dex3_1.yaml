# Two Unitree Dex3-1 three-finger hands (G1): 7 joints each, in Dex3 motor order
# (thumb 0-2, middle 0-1, index 0-1). Names, position limits and torque limits
# come from unitree_ros robots/g1_description/g1_29dof_with_hand_rev_1_0.urdf.
# The hands are mirrored: left fingers close towards negative angles, right
# towards positive. Listed after a body, the joints append to its joints and the
# end-effectors fill in its left_hand / right_hand.

embodiment:
  joints:
    # left Dex3-1, motor order of rt/dex3/left/cmd
    - {name: left_hand_thumb_0,   position_limit: [-1.0472, 1.0472], torque_limit: 2.45}  # 29
    - {name: left_hand_thumb_1,   position_limit: [-0.7243, 1.0472], torque_limit: 1.4}   # 30
    - {name: left_hand_thumb_2,   position_limit: [0.0, 1.7453],     torque_limit: 1.4}   # 31
    - {name: left_hand_middle_0,  position_limit: [-1.5708, 0.0],    torque_limit: 1.4}   # 32
    - {name: left_hand_middle_1,  position_limit: [-1.7453, 0.0],    torque_limit: 1.4}   # 33
    - {name: left_hand_index_0,   position_limit: [-1.5708, 0.0],    torque_limit: 1.4}   # 34
    - {name: left_hand_index_1,   position_limit: [-1.7453, 0.0],    torque_limit: 1.4}   # 35
    # right Dex3-1, motor order of rt/dex3/right/cmd
    - {name: right_hand_thumb_0,  position_limit: [-1.0472, 1.0472], torque_limit: 2.45}  # 36
    - {name: right_hand_thumb_1,  position_limit: [-1.0472, 0.7243], torque_limit: 1.4}   # 37
    - {name: right_hand_thumb_2,  position_limit: [-1.7453, 0.0],    torque_limit: 1.4}   # 38
    - {name: right_hand_middle_0, position_limit: [0.0, 1.5708],     torque_limit: 1.4}   # 39
    - {name: right_hand_middle_1, position_limit: [0.0, 1.7453],     torque_limit: 1.4}   # 40
    - {name: right_hand_index_0,  position_limit: [0.0, 1.5708],     torque_limit: 1.4}   # 41
    - {name: right_hand_index_1,  position_limit: [0.0, 1.7453],     torque_limit: 1.4}   # 42
  end_effectors:
    - name: left_hand
      joints: [left_hand_thumb_0, left_hand_thumb_1, left_hand_thumb_2,
               left_hand_middle_0, left_hand_middle_1, left_hand_index_0, left_hand_index_1]
      driver: {type: unitree_handcmd, side: left}
    - name: right_hand
      joints: [right_hand_thumb_0, right_hand_thumb_1, right_hand_thumb_2,
               right_hand_middle_0, right_hand_middle_1, right_hand_index_0, right_hand_index_1]
      driver: {type: unitree_handcmd, side: right}
