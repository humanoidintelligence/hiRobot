# H1 head camera.
embodiment:
  # Head camera: RealSense D435i colour, as JPEG over ZeroMQ from Unitree's
  # teleoperation image_server (xr_teleoperate), which runs on the computer the
  # camera is plugged into: by default the development computer PC2,
  # 192.168.123.162, port 5555, 1280x720. If yours is plugged in elsewhere or
  # serves another size, override address / width / height in a local config
  # (docs/setup/unitree.md, "Head camera (H1)"). The camera driver only runs with a
  # real driver (driver: unitree_sdk2); with the default 'sim' driver it is skipped.
  cameras:
    - name: head
      width: 1280
      height: 720
      driver:
        type: unitree_image_server
        address: tcp://192.168.123.162:5555
