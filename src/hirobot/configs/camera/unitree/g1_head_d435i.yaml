# G1 head camera.
embodiment:
  # Head camera: RealSense D435i colour, served by Unitree's videohub on PC2 as
  # JPEG at its native 1920x1080. The camera driver only runs with a real body
  # (driver: unitree_sdk2); with the default 'toy' driver it is skipped.
  cameras:
    - name: head
      width: 1920
      height: 1080
      driver:
        type: unitree_videohub
      # Pose on torso_link, used by the MuJoCo body to render the same view.
      # From d435_joint in unitree_ros's G1 URDF (xyz 0.0576 0.0175 0.4299,
      # pitched down 47.6 deg), turned into the optical frame (z forward,
      # x right, y down). fovy is the D435i colour camera's nominal vertical
      # field of view (about 69 x 42 deg). Nominal values, not calibrated.
      mount:
        body: torso_link
        pos: [0.0576235, 0.01753, 0.42987]
        quat: [-0.659252, 0.659252, -0.255707, 0.255707]
        fovy: 42
