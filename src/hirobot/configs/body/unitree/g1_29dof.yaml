# Unitree G1 — 29-DoF humanoid.
#
# Joint names/order follow the G1 low-level JointIndex enum in
# unitree_sdk2_python example/g1/low_level/g1_low_level_example.py
# (indices 0-28). Uses the unitree_hg DDS message family. The 23-DoF G1 variant
# locks the waist roll/pitch and both wrist pitch/yaw.

embodiment:
  name: unitree-g1
  kind: humanoid
  control_hz: 50
  floating_base: true
  joints:
    - name: left_hip_pitch        # 0
    - name: left_hip_roll         # 1
    - name: left_hip_yaw          # 2
    - name: left_knee             # 3
    - name: left_ankle_pitch      # 4
    - name: left_ankle_roll       # 5
    - name: right_hip_pitch       # 6
    - name: right_hip_roll        # 7
    - name: right_hip_yaw         # 8
    - name: right_knee            # 9
    - name: right_ankle_pitch     # 10
    - name: right_ankle_roll      # 11
    - name: waist_yaw             # 12
    - name: waist_roll            # 13
    - name: waist_pitch           # 14
    - name: left_shoulder_pitch   # 15
    - name: left_shoulder_roll    # 16
    - name: left_shoulder_yaw     # 17
    - name: left_elbow            # 18
    - name: left_wrist_roll       # 19
    - name: left_wrist_pitch      # 20
    - name: left_wrist_yaw        # 21
    - name: right_shoulder_pitch  # 22
    - name: right_shoulder_roll   # 23
    - name: right_shoulder_yaw    # 24
    - name: right_elbow           # 25
    - name: right_wrist_roll      # 26
    - name: right_wrist_pitch     # 27
    - name: right_wrist_yaw       # 28
  end_effectors:
    # frame: the link the pose is read from (wrist yaw link origin, as in unitree_ros).
    - name: left_hand
      frame: {body: left_wrist_yaw_link}
    - name: right_hand
      frame: {body: right_wrist_yaw_link}
