# Unitree H1-2 — 27-DoF humanoid.
#
# Joint names/order follow the H1-2 low-level JointIndex enum in
# unitree_sdk2_python example/h1_2/low_level/h1_2_low_level_example.py
# (indices 0-26). Uses the unitree_hg DDS message family. Compared to H1, the
# H1-2 adds 2-DoF ankles and 3-DoF wrists.

device: body
control_hz: 50
floating_base: true
joints:
  - name: left_hip_yaw          # 0
  - name: left_hip_pitch        # 1
  - name: left_hip_roll         # 2
  - name: left_knee             # 3
  - name: left_ankle_pitch      # 4
  - name: left_ankle_roll       # 5
  - name: right_hip_yaw         # 6
  - name: right_hip_pitch       # 7
  - name: right_hip_roll        # 8
  - name: right_knee            # 9
  - name: right_ankle_pitch     # 10
  - name: right_ankle_roll      # 11
  - name: waist_yaw             # 12
  - name: left_shoulder_pitch   # 13
  - name: left_shoulder_roll    # 14
  - name: left_shoulder_yaw     # 15
  - name: left_elbow            # 16
  - name: left_wrist_roll       # 17
  - name: left_wrist_pitch      # 18
  - name: left_wrist_yaw        # 19
  - name: right_shoulder_pitch  # 20
  - name: right_shoulder_roll   # 21
  - name: right_shoulder_yaw    # 22
  - name: right_elbow           # 23
  - name: right_wrist_roll      # 24
  - name: right_wrist_pitch     # 25
  - name: right_wrist_yaw       # 26

frames:
  - {name: left_hand}
  - {name: right_hand}

# The MJCF is h1_2_handless_hirobot.xml from the hirobot-assets dataset: unitree_ros's
# robots/h1_2_description/h1_2_handless.xml (BSD-3-Clause) with torso_joint renamed
# to waist_yaw_joint; nothing else changes. It is not shipped with hiRobot. Fetch it
# with
#
#   pip install 'hirobot[assets]'
#   hirobot assets fetch unitree_h1_2
#
# Gains and armature are for the simulation (sim:), not the real robot's. The MJCF
# has no rotor inertia, so under the default PD (kp 60, kd 1) the light wrist links
# oscillated (left_wrist_yaw up to 264 rad/s). armature reuses the G1 values
# (body/unitree/g1.yaml: legs and waist from FRoM-W1's G1 MJCF, 0.003597 for the arms);
# they are estimates, not measured. kp / kd are set so every joint holds its
# home pose within 0.05 rad (tests/test_sim_tracking.py). Arms held straight out
# at zero still sag about 0.5 rad at the shoulder under gravity.
model:
  mjcf: ~/.cache/hirobot/assets/unitree_ros/robots/h1_2_description/h1_2_handless_hirobot.xml
  #     hip_y hip_p hip_r knee ank_p ank_r   (left, then right)
  kp: [200, 200, 200, 300, 40, 40,
       200, 200, 200, 300, 40, 40,
       300,                                  # waist yaw
       150, 150, 80, 80, 20, 20, 20,         # left arm: shoulder p/r/y, elbow, wrist r/p/y
       150, 150, 80, 80, 20, 20, 20]         # right arm
  kd: [5, 5, 5, 6, 2, 2,
       5, 5, 5, 6, 2, 2,
       6,
       3, 3, 2, 2, 1, 1, 1,
       3, 3, 2, 2, 1, 1, 1]
  armature: [0.0103, 0.0251, 0.0103, 0.0251, 0.003597, 0.003597,
             0.0103, 0.0251, 0.0103, 0.0251, 0.003597, 0.003597,
             0.0103,
             0.003597, 0.003597, 0.003597, 0.003597, 0.003597, 0.003597, 0.003597,
             0.003597, 0.003597, 0.003597, 0.003597, 0.003597, 0.003597, 0.003597]

driver: {type: unitree_sdk2}
