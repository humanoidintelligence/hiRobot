# Franka FR3 (Panda) with its gripper, driven through a DROID robot server
# (franka_droid, https://github.com/droid-dataset/droid).
#
# Joints joint1 -> joint7, in the order of libfranka's RobotState.q. The frame
# "ee" is what DROID reports as cartesian_position (libfranka's O_T_EE: the
# flange, plus the end-effector offset set in Franka Desk). DROID's gripper
# (a Robotiq 2F-85 on the standard DROID platform) is on that frame and follows
# Action.gripper["ee"] (0 closed, 1 open). driver.ip is the computer running the
# DROID server (the NUC, 172.16.0.2 on the standard DROID network).

device: body
control_hz: 15           # DROID collects and evaluates at 15 Hz
floating_base: false
joints:
  - name: joint1
  - name: joint2
  - name: joint3
  - name: joint4
  - name: joint5
  - name: joint6
  - name: joint7

frames:
  - {name: ee}
grippers: [ee]

driver: {type: franka_droid, ip: 172.16.0.2}
