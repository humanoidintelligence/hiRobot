# Franka FR3 (Panda) with its gripper, driven through a DROID robot server
# (franka_droid, https://github.com/droid-dataset/droid).
#
# Joints joint1 -> joint7, in the order of libfranka's RobotState.q. The frame
# "ee" is what DROID reports as cartesian_position (libfranka's O_T_EE: the
# flange, plus the end-effector offset set in Franka Desk). DROID's gripper
# (a Robotiq 2F-85 on the standard DROID platform) is on that frame and follows
# Action.gripper["ee"] (0 closed, 1 open). driver.ip is the computer running the
# DROID server (the NUC, 172.16.0.2 on the standard DROID network).

device: body
control_hz: 15           # DROID collects and evaluates at 15 Hz
floating_base: false
joints:
  - name: joint1
  - name: joint2
  - name: joint3
  - name: joint4
  - name: joint5
  - name: joint6
  - name: joint7

frames:
  - {name: ee}
grippers: [ee]

mounts:
  # The DROID wrist camera (a ZED Mini) beside the flange (fr3_link7, z out of
  # the flange face at 0.107 m): 9 cm off the axis, 2 cm past the face, looking
  # along the axis toward the gripper's fingers.
  # Nominal, not measured: put a calibrated offset in the robot config's placement.
  wrist_camera:
    link: fr3_link7
    pose: [0.09, 0.0, 0.127, 0.0, 0.0, 0.7071, 0.7071]

# The MJCF is fr3_hirobot.xml from the hirobot-assets dataset: MuJoCo Menagerie's
# franka_fr3/fr3.xml (Apache-2.0) with fr3_joint1..7 renamed to joint1..7; nothing
# else changes. It is the arm alone (no gripper). It is not shipped with hiRobot.
# Fetch it with
#
#   pip install 'hirobot[assets]'
#   hirobot assets fetch menagerie_franka_fr3
model:
  mjcf: ~/.cache/hirobot/assets/menagerie/franka_fr3/fr3_hirobot.xml

driver: {type: franka_droid, ip: 172.16.0.2}
