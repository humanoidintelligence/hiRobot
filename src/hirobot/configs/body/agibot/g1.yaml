# AgiBot G1 (精灵 G01): two 7-DoF arms on a waist (lift + pitch) and a head,
# two grippers, on a wheeled chassis. Driver: agibot_gdk (runs on the robot's
# computer, docs/setup/agibot_g1.md).
#
# Joint names are the motion controller's a2d_v01 model names without the
# idxNN_ prefix. position_limit is the running controller's own range
# (configuration/robot/a2d_v01/model/*.yaml in firmware a2d_G01_2.3.4), which is
# tighter than the URDF for the elbows (joint4) and the waist lift.
# waist_lift_joint is prismatic, in metres.

device: body
control_hz: 30
floating_base: true      # the chassis moves; base pose from its odometer
joints:
  - {name: waist_lift_joint,    position_limit: [0.02, 0.55]}
  - {name: waist_pitch_joint,   position_limit: [0.0, 1.57]}
  - {name: head_yaw_joint,      position_limit: [-1.57, 1.57]}
  - {name: head_pitch_joint,    position_limit: [-0.34, 0.52]}
  - {name: left_arm_joint1,     position_limit: [-3.10, 3.10]}
  - {name: left_arm_joint2,     position_limit: [-2.0, 2.0]}
  - {name: left_arm_joint3,     position_limit: [-3.10, 3.10]}
  - {name: left_arm_joint4,     position_limit: [-1.65, -0.05]}
  - {name: left_arm_joint5,     position_limit: [-3.10, 3.10]}
  - {name: left_arm_joint6,     position_limit: [-1.65, 1.65]}
  - {name: left_arm_joint7,     position_limit: [-3.10, 3.10]}
  - {name: right_arm_joint1,    position_limit: [-3.10, 3.10]}
  - {name: right_arm_joint2,    position_limit: [-2.0, 2.0]}
  - {name: right_arm_joint3,    position_limit: [-3.10, 3.10]}
  - {name: right_arm_joint4,    position_limit: [0.05, 1.65]}
  - {name: right_arm_joint5,    position_limit: [-3.10, 3.10]}
  - {name: right_arm_joint6,    position_limit: [-1.65, 1.65]}
  - {name: right_arm_joint7,    position_limit: [-3.10, 3.10]}

# The frames the motion controller reports: arm_{left,right}_link7 in base_link.
# The Omnipicker grippers are driven by the body driver (Action.gripper).
frames:
  - {name: left_gripper,  link: arm_left_link7}
  - {name: right_gripper, link: arm_right_link7}
grippers: [left_gripper, right_gripper]

driver: {type: agibot_gdk}
