# ALOHA 2: two ViperX 300 6-DoF arms with parallel grippers, facing each other
# across a table (Trossen / Google DeepMind bimanual rig), as one body.
#
# Joint names, order, limits and gains are those of MuJoCo Menagerie's ALOHA 2
# MJCF (aloha/aloha.xml): per arm waist, shoulder, elbow, forearm_roll,
# wrist_angle, wrist_rotate (rad), then left_finger, the gripper (a slide, m,
# 0 closed to 0.041 open; right_finger follows it in the model by an equality).
# Names keep the MJCF's left/ and right/ prefixes. There is no hiRobot driver for
# ALOHA hardware: the body runs on the toy driver or in the simulation.

device: body
control_hz: 50
floating_base: false
joints:
  - {name: left/waist,         position_limit: [-3.14158, 3.14158]}
  - {name: left/shoulder,      position_limit: [-1.85005, 1.25664]}
  - {name: left/elbow,         position_limit: [-1.76278, 1.6057]}
  - {name: left/forearm_roll,  position_limit: [-3.14158, 3.14158]}
  - {name: left/wrist_angle,   position_limit: [-1.8675, 2.23402]}
  - {name: left/wrist_rotate,  position_limit: [-3.14158, 3.14158]}
  - {name: left/left_finger,   position_limit: [0.002, 0.037]}
  - {name: right/waist,        position_limit: [-3.14158, 3.14158]}
  - {name: right/shoulder,     position_limit: [-1.85005, 1.25664]}
  - {name: right/elbow,        position_limit: [-1.76278, 1.6057]}
  - {name: right/forearm_roll, position_limit: [-3.14158, 3.14158]}
  - {name: right/wrist_angle,  position_limit: [-1.8675, 2.23402]}
  - {name: right/wrist_rotate, position_limit: [-3.14158, 3.14158]}
  - {name: right/left_finger,  position_limit: [0.002, 0.037]}

frames:
  - {name: left_ee,  link: left/gripper_link}
  - {name: right_ee, link: right/gripper_link}

mounts:
  # The rig's wrist cameras (RealSense D405), where the MJCF puts its
  # wrist_cam_left / wrist_cam_right, turned into the optical frame (z forward,
  # x right, y down).
  left_wrist_camera:
    link: left/gripper_base
    pose: [0.0, -0.0825, -0.0096, 0.2164, 0.0, 0.0, -0.9763]
  right_wrist_camera:
    link: right/gripper_base
    pose: [0.0, -0.0825, -0.0096, 0.2164, 0.0, 0.0, -0.9763]

# The MJCF comes from MuJoCo Menagerie (aloha, BSD-3-Clause); it is not shipped
# with hiRobot. Fetch it with
#
#   pip install 'hirobot[assets]'
#   hirobot assets fetch menagerie_aloha
#
# aloha.xml is the two arms alone (scene.xml adds the table). Gains are its
# position actuators' kp; its joints carry their own damping and armature, so kd
# is low. home is its neutral_pose keyframe.
model:
  mjcf: ~/.cache/hirobot/assets/menagerie/aloha/aloha.xml
  kp: [43, 265, 227, 78, 37, 10.4, 2000,
       43, 265, 227, 78, 37, 10.4, 2000]
  kd: [1, 2, 2, 1, 1, 0.5, 10,
       1, 2, 2, 1, 1, 0.5, 10]
  home: [0, -0.96, 1.16, 0, -0.3, 0, 0.008,
         0, -0.96, 1.16, 0, -0.3, 0, 0.008]
