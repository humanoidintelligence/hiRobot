# Universal Robots UR5e — 6-DoF fixed-base arm.
#
# Joint names/order follow the UR convention (base -> wrist) reported by
# RTDE actual_q. Fixed base: no IMU/base state. The single task-space frame is
# the TCP, controllable in Cartesian mode via servoL.

device: body
control_hz: 125          # UR5e is e-Series: up to 500 Hz; 125 is a conservative default
floating_base: false
joints:
  - name: shoulder_pan    # 0 (base)
  - name: shoulder_lift   # 1
  - name: elbow           # 2
  - name: wrist_1         # 3
  - name: wrist_2         # 4
  - name: wrist_3         # 5

frames:
  - {name: tcp}

# Tool flange, for mounting an end-effector (e.g. a Robotiq gripper, see
# robots/ur_ur5e_robotiq). wrist_3_link is the last arm link in UR's URDF; the
# flange frame sits on it. Nominal link name only (this body ships no MJCF);
# put any measured gripper offset in the robot config's placement pose.
mounts:
  flange: {link: wrist_3_link}

driver: {type: ur_rtde}
