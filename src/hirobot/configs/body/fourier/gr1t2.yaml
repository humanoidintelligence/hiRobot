# Fourier GR1T2 — 32-DoF humanoid.
#
# Joint names/order follow the robot joint list in the official client config
# fourier-grx-client config/config_GR1_T2.yaml (the floating-base
# root_joint is excluded; the 32 actuated joints are listed in order). The joint
# set matches GR1T1; the T2 mechanism differs on the hardware side. Driven over
# Zenoh via the fourier RobotClient. Control at 100 Hz per that config.

device: body
control_hz: 100
floating_base: true
joints:
  - name: left_hip_roll_joint
  - name: left_hip_yaw_joint
  - name: left_hip_pitch_joint
  - name: left_knee_pitch_joint
  - name: left_ankle_pitch_joint
  - name: left_ankle_roll_joint
  - name: right_hip_roll_joint
  - name: right_hip_yaw_joint
  - name: right_hip_pitch_joint
  - name: right_knee_pitch_joint
  - name: right_ankle_pitch_joint
  - name: right_ankle_roll_joint
  - name: waist_yaw_joint
  - name: waist_pitch_joint
  - name: waist_roll_joint
  - name: head_pitch_joint
  - name: head_roll_joint
  - name: head_yaw_joint
  - name: left_shoulder_pitch_joint
  - name: left_shoulder_roll_joint
  - name: left_shoulder_yaw_joint
  - name: left_elbow_pitch_joint
  - name: left_wrist_yaw_joint
  - name: left_wrist_roll_joint
  - name: left_wrist_pitch_joint
  - name: right_shoulder_pitch_joint
  - name: right_shoulder_roll_joint
  - name: right_shoulder_yaw_joint
  - name: right_elbow_pitch_joint
  - name: right_wrist_yaw_joint
  - name: right_wrist_roll_joint
  - name: right_wrist_pitch_joint

frames:
  - {name: left_hand}
  - {name: right_hand}

# The model is Fourier's URDF from FFTAI/Wiki-GRx-Models (GRX/GR1/gr1t2, GPL-3.0),
# with the 6-DoF Fourier hands; the hand joints are not part of this body. Fourier
# publishes no MJCF for GR1: the simulation (sim:) compiles the URDF itself, but
# safety.sim_check needs an MJCF and refuses this body. MuJoCo drops the URDF's
# <visual> meshes, so simulated cameras see the collision shapes (cylinders).
# It is not shipped with hiRobot. Fetch it with
#
#   pip install 'hirobot[assets]'
#   hirobot assets fetch fourier_gr1
#
# Gains are for the simulation, not the real robot's: set so every joint holds its
# home pose within 0.05 rad (tests/test_sim_tracking.py). Under the default PD
# (kp 60) waist_pitch sagged about 0.3 rad.
model:
  #     hip_r hip_y hip_p knee ank_p ank_r   (left, then right)
  kp: [200, 200, 200, 250, 40, 40,
       200, 200, 200, 250, 40, 40,
       300, 300, 300,                        # waist yaw/pitch/roll
       20, 20, 20,                           # head pitch/roll/yaw
       100, 100, 60, 60, 20, 20, 20,         # left arm: shoulder p/r/y, elbow, wrist y/r/p
       100, 100, 60, 60, 20, 20, 20]         # right arm
  kd: [5, 5, 5, 6, 2, 2,
       5, 5, 5, 6, 2, 2,
       6, 6, 6,
       1, 1, 1,
       3, 3, 2, 2, 1, 1, 1,
       3, 3, 2, 2, 1, 1, 1]
  urdf: ~/.cache/hirobot/assets/fourier/Wiki-GRx-Models/GRX/GR1/gr1t2/urdf/gr1t2_fourier_hand_6dof.urdf

driver: {type: fourier_grx}
