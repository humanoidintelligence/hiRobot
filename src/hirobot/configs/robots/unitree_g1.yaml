# Unitree G1: 29-DoF humanoid with its head camera, microphone and speaker.
#
# Runs on the toy body by default. On hardware drop the toy override (the
# body file's driver is unitree_sdk2) and give the network interface, e.g.
#   make_robot("unitree_g1", overrides={"body": {"driver": {"type": "unitree_sdk2",
#                                                           "network_interface": "eth0"}}})
# (docs/setup/unitree.md).

assembly:
  name: unitree-g1
  parts:
    body: {from: body/unitree/g1, overrides: {driver: {type: toy}}}
    head: {from: camera/intel/d435i}
    head_mic: {from: microphone/unitree/g1}
    head_speaker: {from: speaker/unitree/g1}
  placement:
    head: {on: body.head_camera}
