# Unitree H1: 19-DoF humanoid with its head camera.
#
# Runs on the toy body by default; on hardware the body file's driver
# (unitree_sdk2, msg_family: go) applies when the toy override is dropped
# (docs/setup/unitree.md).

assembly:
  name: unitree-h1
  parts:
    body: {from: body/unitree/h1, overrides: {driver: {type: toy}}}
    head: {from: camera/intel/d435i_image_server}
  placement:
    head: {on: body.head_camera}
