# Unitree H1 with two Inspire RH56DFX hands: 19 body joints and 6 per hand.
#
# Finger positions are normalised, 0 = closed and 1 = open. With the body on
# unitree_sdk2, rt/lowcmd carries joints 0-18; the hands go through a bridge on
# the computer their USB-serial adapter is plugged into (usually PC2,
# 192.168.123.162, /dev/ttyUSB0). The hand driver depends on the bridge:
#   unitree_motorcmds  Unitree h1_inspire_service 1.0.1 (not 1.0.2):
#                      rt/inspire/{cmd,state}, 12 motors, 0-5 right, 6-11 left.
#                      This is what the hand files use.
#   inspire_sdkpy      scripts/inspire_serial_to_dds.py:
#                      rt/inspire_hand/{ctrl,state}/{l,r}. Override each hand's
#                      driver with {type: inspire_sdkpy, side: left|right}.
# Versions and setup: docs/setup/unitree.md, "Inspire hands (H1)". Pass
# --msg-family go to scripts/unitree_setup.py.

assembly:
  name: unitree-h1-inspire
  parts:
    body: {from: body/unitree/h1, overrides: {driver: {type: toy}}}
    left_hand: {from: end_effector/inspire/rh56dfx_left}
    right_hand: {from: end_effector/inspire/rh56dfx_right}
    head: {from: camera/intel/d435i_image_server}
  placement:
    left_hand: {on: body.left_wrist}
    right_hand: {on: body.right_wrist}
    head: {on: body.head_camera}
