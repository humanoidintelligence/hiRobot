# Trossen WidowX 250S: 6-DoF arm with its parallel gripper (trossen_dynamixel
# over a U2D2), plus two Intel RealSense D435i cameras — a wrist camera and a
# third-person scene camera, matching a dual-arm teleop data-collection rig.
#
# The gripper is driven by the arm's own driver and read / commanded as
# Observation.gripper["ee"] / Action.gripper["ee"] (0 closed, 1 open).
#
# Runs on the toy body by default; the cameras then are skipped. On hardware
# drop the toy override and set the serial port and each camera's serial, in a
# local config:
#   defaults: [robots/trossen_wx250s]
#   assembly:
#     parts:
#       body:  {overrides: {driver: {type: trossen_dynamixel, port: /dev/ttyDXL}}}
#       wrist: {overrides: {driver: {serial: "<wrist camera serial>"}}}
#       scene: {overrides: {driver: {serial: "<scene camera serial>"}}}
# The camera placements are defaults (the wrist camera on the gripper, the scene
# camera front left of the arm, looking at its workspace), not a measured rig:
# override them in a local config. See docs/setup/trossen_wx250s.md.

assembly:
  name: trossen-wx250s
  parts:
    body: {from: body/trossen/wx250s, overrides: {driver: {type: toy}}}
    wrist: {from: camera/intel/d435i_realsense}
    scene: {from: camera/intel/d435i_realsense}
  placement:
    wrist: {on: body.wrist_camera}
    # pose: [x, y, z, qx, qy, qz, qw] of the optical frame (z forward, y down) in
    # the arm's base frame.
    scene: {pose: [0.9, 0.6, 0.6, 0.3703, 0.7406, -0.5014, -0.2507]}
