# AgiBot G1 (精灵 G01): dual arm on a wheeled chassis, head RGB-D and two wrist cameras.
#
# Runs on the toy body by default. On the robot drop the toy override (the body
# file's driver is agibot_gdk) and run with the robot's system Python and the
# vendor environment sourced (docs/setup/agibot_g1.md). The cameras have no
# placement yet (their mounts on the G1 are not measured).

assembly:
  name: agibot-g1
  parts:
    body: {from: body/agibot/g1, overrides: {driver: {type: toy}}}
    head: {from: camera/intel/d457}
    left_wrist: {from: camera/intel/d405, overrides: {driver: {topic: /camera/hand_left_color}}}
    right_wrist: {from: camera/intel/d405, overrides: {driver: {topic: /camera/hand_right_color}}}
safety:
  gripper_range: [0, 1]
