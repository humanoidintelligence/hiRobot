# Unitree G1 with two Dex3-1 hands (43 joints) in MuJoCo, no hardware needed.
#
# The whole robot unitree_g1_dex3 in the shared simulation (sim:). Its body model
# (the G1 MJCF with hands, and gains and armature for all 43 joints) comes from
# unitree_g1_dex3. The fingers are joints of that model, so the hand drivers do
# not run here.

defaults: [robots/unitree_g1_dex3]

sim:
  fixed_base: [body]       # pelvis welded in place, like the robot hung on a gantry
  base_height: {body: 1.0}
  viewer: false            # set true to open the MuJoCo window
  ramp_seconds: 2.0
  damping_kd: 8.0
safety:
  joint_limit: 3.0
