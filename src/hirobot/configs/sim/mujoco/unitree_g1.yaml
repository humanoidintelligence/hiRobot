# MuJoCo overlay for the Unitree G1 (29 DoF): swaps the body driver for MuJoCo.
#
#   defaults: [robots/unitree_g1, sim/mujoco/unitree_g1]
#
# Only body: changes. The embodiment (joints, head camera with its mount, audio)
# comes from the whole robot: the head camera is rendered from its mount, the
# real camera and audio drivers are skipped in simulation.
#
# The MJCF comes from unitreerobotics/unitree_ros (robots/g1_description,
# BSD-3-Clause); it is not shipped with hiRobot. Fetch it with:
#
#   git clone --depth 1 --filter=blob:none --sparse \
#       https://github.com/unitreerobotics/unitree_ros.git ~/.cache/hirobot/unitree_ros
#   git -C ~/.cache/hirobot/unitree_ros sparse-checkout set robots/g1_description
#
# Gains match RoboJuDo's G1 stiffness/damping (robojudo/config/g1/env/g1_env_cfg.py).

body:
  driver: mujoco
  model_path: ~/.cache/hirobot/unitree_ros/robots/g1_description/g1_29dof_rev_1_0.xml
  fixed_base: true     # pelvis welded in place, like the robot hung on a gantry
  base_height: 1.0
  viewer: false        # set true to open the MuJoCo window
  ramp_seconds: 2.0
  damping_kd: 8.0
  # Rotor inertia per joint (the unitree_ros MJCF has none, which makes the light
  # wrist links unstable under PD). Hip/knee/ankle/waist-yaw/roll/arm values follow
  # the G1 MJCF in FRoM-W1 (H-ACT/retarget/assets/robot/g1/g1.xml). That file has no
  # value for waist_pitch or the wrists: waist_pitch reuses 0.0103 and the wrists
  # reuse 0.003597. Both are estimates, not measured.
  armature: [0.0103, 0.0251, 0.0103, 0.0251, 0.003597, 0.003597,
             0.0103, 0.0251, 0.0103, 0.0251, 0.003597, 0.003597,
             0.0103, 0.0103, 0.0103,
             0.003597, 0.003597, 0.003597, 0.003597, 0.003597, 0.003597, 0.003597,
             0.003597, 0.003597, 0.003597, 0.003597, 0.003597, 0.003597, 0.003597]
  #            hip_p hip_r hip_y knee ank_p ank_r   (left, then right)
  default_kp: [100, 100, 100, 150, 40, 40,
               100, 100, 100, 150, 40, 40,
               200, 200, 200,                        # waist yaw/roll/pitch
               40, 40, 40, 40, 20, 20, 20,           # left arm
               40, 40, 40, 40, 20, 20, 20]           # right arm
  default_kd: [5, 5, 5, 5, 2, 2,
               5, 5, 5, 5, 2, 2,
               6, 6, 6,
               2, 2, 2, 2, 2, 2, 2,
               2, 2, 2, 2, 2, 2, 2]


safety:
  joint_limit: 3.0
